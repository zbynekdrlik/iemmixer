[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown"]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via p256/p384 0.13 (iem-core vapid, iem-server, jsonwebtoken 11.1 rust_crypto); the fix needs p256 0.14, which jsonwebtoken does not support yet; tracked in #74" },
  { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin timing attack, no fixed release) only via jsonwebtoken's rust_crypto backend; iem-server signs and verifies HS256 and ES256 only, iem-soakclient signs HS256 only, and neither builds an RSA key" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "MPL-2.0", "BSL-1.0", "CC0-1.0", "0BSD", "CDLA-Permissive-2.0", "Unlicense", "MIT-0",
  # assert_no_alloc (dev-dependency of the DSP crates: I7 allocation checks in tests)
  "BSD-1-Clause",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# aws-lc-sys (rustls' default aws-lc-rs crypto provider) is ISC AND (Apache-2.0 OR ISC) AND OpenSSL
[[licenses.exceptions]]
crate = "aws-lc-sys"
allow = ["OpenSSL"]

# D1(a): the MGA JS Limiter port is GPL-3.0-or-later; only the engine links it (S3)
[[licenses.exceptions]]
crate = "iem-limiter-mga"
allow = ["GPL-3.0-or-later"]

# D1(a): the engine links the limiter, so the engine binary is GPL (S3)
[[licenses.exceptions]]
crate = "iem-engine"
allow = ["GPL-3.0-or-later"]

# D1(a): the migration CLI links the engine (site, graph, persist), so it is GPL (S4)
[[licenses.exceptions]]
crate = "iem-migrate"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
