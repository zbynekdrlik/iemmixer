[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown"]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "MPL-2.0", "BSL-1.0", "CC0-1.0", "0BSD", "CDLA-Permissive-2.0", "Unlicense", "MIT-0",
  # assert_no_alloc (dev-dependency of the DSP crates: I7 allocation checks in tests)
  "BSD-1-Clause",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# aws-lc-sys (rustls' default aws-lc-rs crypto provider) is ISC AND (Apache-2.0 OR ISC) AND OpenSSL
[[licenses.exceptions]]
crate = "aws-lc-sys"
allow = ["OpenSSL"]

# D1(a): the MGA JS Limiter port is GPL-3.0-or-later; only the engine links it (S3)
[[licenses.exceptions]]
crate = "iem-limiter-mga"
allow = ["GPL-3.0-or-later"]

# D1(a): the engine links the limiter, so the engine binary is GPL (S3)
[[licenses.exceptions]]
crate = "iem-engine"
allow = ["GPL-3.0-or-later"]

# D1(a): the migration CLI links the engine (site, graph, persist), so it is GPL (S4)
[[licenses.exceptions]]
crate = "iem-migrate"
allow = ["GPL-3.0-or-later"]

# Gen 3 (#72, design §3): our Dante device adapts parts of teodly/inferno
# (GPL-3.0-or-later OR AGPL-3.0-or-later), so it is GPL; from phase C the GPL engine
# links it on Linux (its Dante backend, plan 2026-10-26 Task 3; already GPL through the
# limiter); the server, the UI and the guard never do (only iem-server's tests run the engine)
[[licenses.exceptions]]
crate = "dante-stack"
allow = ["GPL-3.0-or-later"]

# The Gen 3 box's device binary: a thin wrapper that links dante-stack (#72).
[[licenses.exceptions]]
crate = "iem-dante-dev"
allow = ["GPL-3.0-or-later"]

# The audio contract shared with the Dante device (#72, 2026-10-30), from dante-stack:
# linked through iem-audio-io by the GPL engine only (iem-server, the UI and the guard
# do not depend on iem-audio-io).
[[licenses.exceptions]]
crate = "dante-audio-io"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# All Dante code lives in dante-stack (#72, owner 2026-10-30), consumed by git tag.
allow-git = ["https://github.com/zbynekdrlik/dstack"]
