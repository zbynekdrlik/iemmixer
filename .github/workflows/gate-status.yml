# Posts a box gate's commit status: `iempc gen3-gate` dispatches it because the
# App token holds statuses: read only (airuleset#1272).
name: Gate status

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit the status goes on
        required: true
      context:
        description: Status context
        required: true
      state:
        description: success or failure
        required: true
      description:
        description: Status description
        required: true

permissions:
  statuses: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post the status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          CONTEXT: ${{ inputs.context }}
          STATE: ${{ inputs.state }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f "state=${STATE}" -f "context=${CONTEXT}" -f "description=${DESCRIPTION}"
