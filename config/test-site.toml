# 170: the 17 direct inputs to the 10 output buses (mode 3)
[[engine.sends]]
from = ["mic1", "mic2", "mic3", "mic4", "mic5", "mic6", "mic7", "mic8", "mic9", "mic10", "hand1", "hand2", "hand3", "eng_mic", "keys", "iemonly", "content"]
to = ["member1", "member2", "member3", "member4", "member5", "member6", "member7", "member8", "member9", "engineer"]
tap = "pre"

# 70: the 7 stems-group inputs to the 10 stems buses (mode 3)
[[engine.sends]]
from = ["click", "guide", "drums", "bass", "inst", "other", "bgvs"]
to = ["member1.stems", "member2.stems", "member3.stems", "member4.stems", "member5.stems", "member6.stems", "member7.stems", "member8.stems", "member9.stems", "engineer.stems"]
tap = "pre"

# 1: HAND_1 to the translator (mode 3)
[[engine.sends]]
from = ["hand1"]
to = ["translator"]
tap = "pre"

# 10: each stems bus to its output bus (mode 0), one table per pair
