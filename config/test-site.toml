# Synthetic site for CI, E2E and tests: the real site's shape (9 members plus
# the engineer, 24 inputs, the translator) with placeholder names and synthetic
# channel numbers. Never real site data (program spec P6).
port = 8080
engine_pipe = "iemmixer-engine"
tls = false
https_domain = "mixer.example.org"
lan_url = "http://10.0.0.10"
vapid_subject = "mailto:admin@example.org"
backup_schedule = ["13:00", "21:00"]
backup_retention_days = 60

# HIL's spare outputs (the owner's decision on #9, 2026-09-28): device
# channels no mix uses, so the HIL test signal never reaches a band member.
# The engine opens them after the topology's TX under --test-signal.
[guard]
hil_tx = [61, 62]

