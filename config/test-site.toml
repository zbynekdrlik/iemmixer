# 8 bus-to-bus into the elevated member (mode 0)
[[engine.sends]]
from = ["member2", "member3", "member4", "member5", "member6", "member7", "member8", "member9"]
to = ["member1"]
tap = "post"

# 9 bus-to-bus into the engineer (mode 0)
[[engine.sends]]
from = ["member1", "member2", "member3", "member4", "member5", "member6", "member7", "member8", "member9"]
to = ["engineer"]
tap = "post"
