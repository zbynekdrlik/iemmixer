# Synthetic site for CI, E2E and tests: the real site's shape (9 members plus
# the engineer, 24 inputs, the translator) with placeholder names and synthetic
# channel numbers. Never real site data (program spec P6).
port = 8080
engine_pipe = "iemmixer-engine"
tls = false
https_domain = "mixer.example.org"
lan_url = "http://10.0.0.10"
vapid_subject = "mailto:admin@example.org"
backup_schedule = ["13:00", "21:00"]
backup_retention_days = 60
# CI stand-in for S6's `iemmode event`: a command that succeeds and does nothing.
back_to_reaper = ["true"]
# Like every dev site before the cutover (P9): PINs change only in the
# predecessor, so the PIN dialog gets 409 (e2e/tests/pin-freeze.spec.ts).
pin_changes = false

# The ASIO card (S6, `iem-engine run --backend asio`): synthetic
# driver, DLL and registry key, never the real ones (P6: those live in the
# ops site). The driver's preferred buffer holds 32 only while the engine
# opens it; REAPER's original is restored right after.
[card]
driver = "Test Card"
module = "testcard.dll"
frames = 32
pref_key = 'Software\ASIO\Test Card'
pref_name = "PrefBuffSize"
pref_original = { kind = "dword", raw = "64" }

# HIL's spare card outputs (S6; the owner's decision on #9, 2026-09-28): card
# channels no mix uses, so the HIL test signal never reaches a band member.
# The engine opens them after the topology's TX under --test-signal. It reads
# only this key of the guard's table; the guard's other keys live in the ops
# site (iem-guard's tests carry their own).
[guard]
hil_tx = [94, 95]

