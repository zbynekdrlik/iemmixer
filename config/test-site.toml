# Engine topology (program spec §3.1, #20 design note §4): 24 inputs on 32 RX
# channels, the stems group, and 11 mixes: 9 members and the engineer (stereo)
# and the translator (mono). Every mix hears every input (the stems through
# the group); member1 and the engineer also hear other members' mixes (the
# Mixes tab), so member1 is declared after the mixes it hears.
# Synthetic channels: RX 101-132, TX 71-88 (members), 91/92 (engineer),
# 93 (translator), in a synthetic 160-channel map.
[engine]
channels = 160
engineer = "engineer"

[[engine.inputs]]
id = "mic1"
rx = [101]

