# Engine topology: 24 inputs on 32 RX
# channels, the stems group, and 11 mixes: 9 members and the engineer (stereo)
# and the translator (mono). Every mix hears every input (the stems through
# the group). member1 and member3 hear the other members' sets as peers
# (#58, the Mixes tab): each one's own mix, without the mixes that set hears,
# declared anywhere, so member1 and member3 hear each other. The engineer
# hears every member's whole mix, each declared before it.
# Synthetic channels: RX 1-32, TX 1-18 (members), 21/22 (engineer),
# 23 (translator), in a synthetic 64-channel map; TX 61/62 are HIL's spare
# outputs (above), their D5(b) loopback returns RX 61/62: a device of 64 RX
# and 64 TX fits the whole site.
[engine]
channels = 64
engineer = "engineer"

[[engine.inputs]]
id = "mic1"
rx = [1]

[[engine.inputs]]
id = "mic2"
rx = [2]

[[engine.inputs]]
id = "mic3"
