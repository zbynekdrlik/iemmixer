# iemmixer site configuration — example documenting every key. The real site
# file lives only in the private ops repository and on the PC.
# Secrets never go here: the JWT key, VAPID key, PIN hashes and pepper are
# generated on the PC under `<config dir>/secrets/`. Unknown keys are errors.

# HTTP port of the web app.
port = 80
# The engine's control pipe (a socket path on Unix, a pipe name on Windows);
# the media pipe is "<engine_pipe>.media". IEMMIXER_ENGINE_PIPE overrides it.
engine_pipe = "iemmixer-engine"
# HTTPS for phones (PWA install); certificate and key next to this file.
tls = false
https_port = 443
tls_cert = "cert.pem"
tls_key = "key.pem"
# Public host served through the tunnel (HTTPS redirect, tray "Copy URL",
# LAN hint on pages opened through it).
https_domain = "mixer.example.org"
# Local-network URL shown to band members while the tunnel is down.
lan_url = "http://10.0.0.10"
# Origins allowed to show the UI in a frame (CSP frame-ancestors); https only.
# Absent: no page may frame it.
# frame_ancestors = ["https://surface.example"]
# Public IP of the venue network (LAN/WAN badge); detected when absent.
# local_public_ip = "198.51.100.7"
# Web Push contact (VAPID "sub" claim).
vapid_subject = "mailto:admin@example.org"
# cloudflared readiness endpoint polled by the tunnel watchdog.
tunnel_ready_url = "http://127.0.0.1:20241/ready"
# Automatic backups (local time, HH:MM) and their retention in days.
backup_schedule = ["13:00", "21:00"]
backup_retention_days = 60
# The engineer's "Back to REAPER" switch (program spec §4.3): the command the
# server starts (no shell) for POST /api/mode/event after the engineer PIN.
# Empty or absent: no switch (and no button in the engineer's console).
back_to_reaper = ["iemmode", "event"]
# PIN changes in the web UI (P9). Until the cutover PINs change only in the
# predecessor app: the guard writes `false` into every dev and trial site
# and the PIN dialog then shows why. Absent: true.
pin_changes = true
# No [activity] table: the band-activity alarm was removed by the owner's
# decision (#38); an older site's table is still accepted and ignored.

# The server keeps https_domain's certificate itself (#91): ACME DNS-01
# through the Cloudflare DNS API, renewed when under 30 days are left, written
# to tls_cert/tls_key and loaded without a restart. Needs tls = true and
# https_domain. The Cloudflare token (Zone > DNS > Edit on the name's zone)
# is never in this file: `iem-server cloudflare set-token` reads it from
# stdin and seals it for the server's user (Windows, DPAPI). Absent: the
# certificate files are served as they are.
# [acme]
# directory = "https://acme-v02.api.letsencrypt.org/directory"  # the default
# contact = "owner@example.org"                                 # optional
# propagation_s = 20                                            # at most 600

# Band members and the engineer (login grid). `id` is the URL and the login
# (keep the predecessor's ids: tokens stay valid), `name` the tile label,
# `mix` the engine mix the person hears.
[[members]]
id = "member1"
name = "Member1"
mix = "member1"

[[members]]
id = "engineer"
name = "Engineer"
mix = "engineer"

# How the engine's inputs are shown. `category` = mics (default) | stems | tech
# (inputs of an engine group are always stems); `owner` may edit the input's
# EQ besides the engineer, and a member's first owned input is their own
# channel on the Main tab.
[[inputs]]
id = "mic1"
name = "MEMBER1 mic"
owner = "member1"

[[inputs]]
id = "content"
name = "CONTENT"
category = "tech"
