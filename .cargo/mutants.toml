# cargo-mutants: PR gate in .github/workflows/ci.yml (diff-scoped; the shard
# count is the `shard:` matrix length, sized by the `mutants-list` job), full
# sweep in .github/workflows/mutation-full.yml (on demand). Both pass
# --copy-target=true after a warm-up build and --timeout 60 (with
# --baseline=skip there is no measured test time, so a hung mutant would
# otherwise hold its job for 300 s). Tests run per package only. A mutant
# caught only by a timeout is tested again by scripts/mutants_recheck.py (#23).
# An exclude_re entry pinned to a line (`<path>\\.rs:<N>:` or
# `<path>\\.rs:(<N>|<M>):`) carries one `# anchor <N>: <source text>` comment
# per line right above it; scripts/check_mutants_anchors.py fails when that
# line no longer reads so (#32): move the anchor with the code.
profile = "mutants"
test_tool = "nextest"

exclude_globs = [
  # Windows-only DPAPI calls: not compiled on the Linux runners; the `windows`
  # CI job runs their tests (`cargo test -p iem-server --lib pepper::`).
  "crates/iem-server/src/pepper/dpapi.rs",
  # Tauri tray shell: built and linted on Windows only.
  "crates/iem-tray/**",
  # Windows-only ASIO host and backend (unsafe FFI, S1a/S6): not compiled on
  # the Linux runners; the windows jobs build and lint it, HIL exercises it on
  # the PC. Its decisions live in the mutated format.rs, telemetry.rs,
  # glitch_report.rs, spike_run.rs, channels.rs, period.rs, reset.rs,
  # owner.rs, messages.rs and iem-win's prefwin.rs.
  "crates/iem-audio-io/src/asio.rs",
  # Windows-only placement/priority/clock/marker FFI (S1c): not compiled on
  # the Linux runners; the windows jobs build it. Only the S1a/S1c spike
  # calls it (asio.rs's spike Host::start and examples/asio_spike/), in its
  # measurement windows on the PC; the S6 engine places and prioritises
  # itself through iem_win::power, so HIL never runs it. Its portable
  # placement logic (parse_lps, ids_for) lives in the mutated cpuset.rs; the
  # CPU-set buffer decode is FFI, verified on the PC by the spike.
  "crates/iem-audio-io/src/os.rs",
  # The S1a/S1c spike program (a Windows-only main, examples/asio_spike/:
  # main.rs and tests.rs), now only thread, FFI and JSON plumbing. Its
  # decisions live in the mutated glitch_report.rs (keep_glitches,
  # glitch_qpc, marker_text, the marker loop) and spike_run.rs (the exit
  # code table, check_stress_cpus, the placement results, keeps_busy,
  # setup_failure, hwlat_ready, scan_ends); its parser, Stress and
  # hwlat_scan are tested on every OS.
  "crates/iem-audio-io/examples/**",
  # The engine's ASIO start-up (S6): Windows effects, not compiled on the
  # Linux runners; the windows job lints it and runs its no-driver refusal.
  # Its decisions live in the mutated engine.rs (lock_due, the parser,
  # check_site), control.rs (Ending, the lock report) and site.rs ([card]).
  "crates/iem-engine/src/asio.rs",
  # The Windows side of the engine's pipes (S6): not compiled on Linux; the
  # windows job runs tests/pipes.rs over it. Its decisions are pipe.rs's
  # sddl_for, dacl_sids, sddl_is_private, name_taken and polled_read, which
  # stay mutated.
  "crates/iem-engine/src/pipe/win.rs",
  # Windows FFI wrappers (S6), not compiled on Linux; the windows job runs
  # their tests; decisions live in callers and in iem-win's portable decide.rs,
  # which stays mutated with prefwin.rs and lib.rs.
  "crates/iem-win/src/console.rs",
  "crates/iem-win/src/errmode.rs",
  # The durable rename (#32 minor-7): the engine's OsFiles renames through
  # it on Windows only; its Windows test and the engine's persistence tests
  # run in the windows job.
  "crates/iem-win/src/file.rs",
  "crates/iem-win/src/pipe.rs",
  "crates/iem-win/src/power.rs",
  "crates/iem-win/src/process.rs",
  "crates/iem-win/src/registry.rs",
  "crates/iem-win/src/spawn.rs",
  "crates/iem-win/src/sync.rs",
  "crates/iem-win/src/token.rs",
  "crates/iem-win/src/window.rs",
  "crates/iem-win/src/win.rs",
  # The Windows-only Ctrl-Break test helper (feature test-helper).
  "crates/iem-win/src/bin/**",
  # The guard's Windows effects (WinPc, S6): not compiled on Linux; the
  # windows job builds and tests them. Their decisions live in the mutated
  # pc.rs, site.rs, effects/ and handover.rs (parsers included).
  "crates/iem-guard/src/win/**",
  # The Windows side of the guard's pipe writes (the bounded, clean writer
  # over iem-win's write_within: the guard pipe's replies, the supervisor's
  # sends): not compiled on Linux; the windows job runs the guard's pipe and
  # supervisor tests over it. pipe.rs, its Unix twin included, stays mutated.
  "crates/iem-guard/src/pipe/win.rs",
  # The guard's two mains (S6 Task 10): Windows effects (the mutex, WinPc,
  # the session window, the detached hand-over) around the mutated
  # iem_guard::{cli, daemon, install, pipe}, which hold every decision.
  "crates/iem-guard/src/bin/**",
  # The soak client's binary (S7): argv, env, CPU Set and file glue; the
  # decisions are in lib.rs (parse_args, pin_from, credential, read_secret,
  # engineer_token, origin, Gaps, write_summary), net.rs (run), tally.rs and
  # mint.rs (the token subcommand), mutated; CI runs the binary (tests/fake_server/ checks its exit codes,
  # the e2e job's soak step runs it against the real server). Its
  # #[cfg(windows)] CPU Set call is not compiled on the Linux runners, so no
  # test there could catch its mutant.
  "crates/iem-soakclient/src/main.rs",
]

exclude_re = [
  # Server bootstrap and WebSocket handlers need a bound server, a JWT and a
  # WS client; the Playwright suite covers them (whole-body replacements only).
  "replace start_server -> ",
  "replace run_server -> ",
  # WebSocket upgrades and per-connection loops (S5): socket reads, writes and
  # timers; the message logic is in tested functions (view::command,
  # updates_for, own_echo, addressed, alert_catchup, slot_of, TalkLock, the
  # talkback decoder; the listen probe's asks_for_probe, feeds, Feeds::next
  # and listen_ws/probe_gate.rs) and the E2E suites drive the sockets end to
  # end.
  "iem-server/src/mixer_ws\\.rs.*\\b(ws_mixer|session|close_reload)\\b",
  "iem-server/src/listen_ws\\.rs.*\\b(ws_audio|session)\\b",
  "iem-server/src/talkback_ws\\.rs.*\\b(ws_talkback|session)\\b",
  # The console's background loops (100 ms meters, 250 ms janitor): their steps
  # are tested functions (MeterMerge, SoloJanitor, TalkLock).
  "iem-server/src/console\\.rs.*\\b(spawn_tasks|meter_task|janitor_task)\\b",
  # Test-only constructors.
  "new_for_test",
  # Tunnel watchdog loop and the Windows sc.exe restart.
  "spawn_tunnel_watch",
  "restart_service_blocking",
  "sc_windows",
  # Browser-only fetches and context accessors in the UI; covered by
  # e2e/tests/site-links.spec.ts, e2e/tests/login-protection.spec.ts,
  # e2e/tests/engineer.spec.ts (the switch; its messages are the tested
  # switch_error_message) and e2e/tests/pin-freeze.spec.ts (the PIN change;
  # its messages are the tested change_pin_error).
  "iem-ui/src/api\\.rs.*replace (login|get_site_links|back_to_reaper|change_pin) ",
  # The token check's browser-only fetch; its verdict on the answer is the
  # tested token_refused, and e2e/tests/header.spec.ts drives it (502 while
  # the server is gone, 200 after the reconnect).
  "iem-ui/src/api\\.rs.*\\bverify_token_valid\\b",
  # Leptos component bodies (S5): a PascalCase function is a component; its
  # body is DOM event closures and effects that native tests cannot mount. The
  # E2E suites drive them; their pure logic lives in tested helpers.
  "iem-ui/src/.* in [A-Z][A-Za-z]*$",
  # Browser-only fetches of the preset modal (the server side is tested).
  "iem-ui/src/components/preset_modal\\.rs.*\\b(fetch_presets|save_preset_api|update_preset_api|restore_preset_api|delete_preset_api|server_message)\\b",
  # The next-macrotask deferral (window.setTimeout).
  "iem-ui/src/components/mod\\.rs.*after_event",
  # The console's socket send: a web_sys WebSocket and its ready state (a
  # no-op off the browser).
  "iem-ui/src/components/console_section\\.rs.*(replace send with \\(\\)| in send$)",
  # The handshake's localStorage and location.reload().
  "iem-ui/src/handshake\\.rs.*\\b(last_reload|reload)\\b",
  # Mixer page state: signal constructors and modal toggles (browser-only).
  "iem-ui/src/pages/mixer/state\\.rs",
  # The tab memo only wraps the tested display_channels.
  "iem-ui/src/pages/mixer/handlers\\.rs.*make_display_channels",
  "iem-ui/src/components/tunnel_status\\.rs.*replace site_links ",
  # Leptos component bodies are DOM event closures and effects: native tests
  # cannot mount a component (web_sys panics off wasm). Their pure logic lives
  # in tested helpers (e.g. dragged_pan, is_foreign_mixer, member_has_photo).
  # Fader: `!is_animating` guards in the touchend/touchcancel handlers.
  "iem-ui/src/components/fader\\.rs.* in Fader$",
  # AlertToast / AlertButton / TalkButton: WebSocket `ready_state() == OPEN`
  # checks and `document.hidden` in click, pointer and visibility handlers.
  "iem-ui/src/components/alert_toast\\.rs.* in AlertToast$",
  "iem-ui/src/components/alert_button\\.rs.* in AlertButton$",
  "iem-ui/src/components/talk_button\\.rs.* in TalkButton$",
  # LandingPage: the sessionStorage + router redirect effect; both branches are
  # covered by e2e/tests/auto-redirect.spec.ts.
  "iem-ui/src/pages/landing\\.rs.* in LandingPage$",
  # SOS alert loops: window intervals via js_sys::Reflect and the service
  # worker notification.
  "iem-ui/src/components/alert_toast\\.rs.*(stop_loops|request_and_notify)",
  # Engineer listen: opens the audio WebSocket and the AudioContext; the frame
  # log sampling and the status mapping are tested helpers.
  "iem-ui/src/components/audio_player\\.rs.*start_listening",
  # localStorage reads/writes of the user settings.
  "iem-ui/src/components/settings_modal\\.rs.*replace UserSettings::(load|save) ",
  # Mixer WebSocket lifecycle (connect, onmessage/onclose closures, intervals,
  # visibility listener); the message logic is in tested helpers
  # (meter_update_due, update_channel, solo_change, clears_shown_alert, …).
  "iem-ui/src/pages/mixer/connection\\.rs.*(setup_connection|connect_websocket)",
  "iem-ui/src/pages/mixer/helpers\\.rs.*ws_send",
  # Push subscription through the service worker's PushManager.
  "iem-ui/src/pages/mixer/push\\.rs.*subscribe_to_push",
  # Engine (S3): effects with no observable outcome through the engine's API.
  # The fsync of a file and of the state directory (persist/files.rs, the
  # file system behind the #32 seam): durability shows only across a power
  # loss; the tests' fault seam fails them to prove the protocol instead.
  # `pause` is the real 200 ms wait between read tries: only time shows it,
  # and the fault seam counts the pauses to test the retry.
  "iem-engine/src/persist/files\\.rs.*\\b(sync_file|sync_dir|pause)\\b",
  # The NullRt pacing thread's end after release; NullRt::stop itself is
  # tested in iem-audio-io (stop_ends_a_running_stream). Its outcome is
  # always Released (NullRt holds no card; #35).
  "iem-engine/src/engine\\.rs.*replace <impl Driver for NullRtDriver>::stop -> StopOutcome with ",
  # Equivalent `>` → `>=` (S2): at equality both branches give the same
  # result, so no input can tell them apart.
  # |x| equal to the running peak: assigning the same value changes nothing.
  "iem-dsp/src/meter\\.rs.*replace > with >= in PeakMeter<CH>::observe",
  # x = ±0: 20·log10(0) = −∞, floored by max(−150) to the else branch's −150.
  "iem-dsp/src/meter\\.rs.*replace > with >= in to_db",
  # mag = 1e-15: 20·log10(1e-15) is exactly −300.0, the else branch's value.
  "iem-dsp/src/eq\\.rs.*replace > with >= in response_db",
  # gain ±0: 20·log10(0) = −∞, floored by max(RAMP_DB_MIN) to RAMP_DB_MIN.
  "iem-dsp/src/eq\\.rs.*replace > with >= in gain_key",
  # GR meter ±0: 20·log10(0) = −∞, floored by max(−150) to the else branch's −150.
  "iem-limiter-mga/src/lib\\.rs.*replace > with >= in Limiter::gr_db",
  # Equivalent (S3). `trips > 0` only skips adding zero trips to the counters.
  "iem-engine/src/rt\\.rs.*replace > with >= in Processor::render_mixes",
  # Equivalent (S3). With the budget spent, `budget >= 0` also cuts the segment at the
  # waiting command; rendering in two pieces is bit-identical (block-size invariance tests).
  # anchor 1252: if budget > 0
  "iem-engine/src/rt\\.rs:1252:.*replace > with >= in <impl Process for Processor>::process",
  # The fade wait's `elapsed < FADE_WAIT`: differs only at the exact nanosecond.
  "iem-engine/src/control\\.rs.*replace < with <= in Control::fade_out",
  # Unobservable (S3): the `!` only decides whether "solos cleared" is logged.
  "iem-engine/src/control\\.rs.*delete ! in Control::tick",
  # Equivalent (S4). The synthetic generator draws k/2^53; a draw equal to a
  # threshold (0.2, 0.4, …) is a 2^-53 event, so `>` and `>=` pick alike.
  "iem-rpp/src/sitegen\\.rs.*replace > with >= in (random_eq|sample_state)$",
  # v = 0: 20·log10(0) = −∞, floored by max(DB_OFF) to the else branch's DB_OFF.
  "iem-rpp/src/import\\.rs.*replace > with >= in lin_to_db$",
  # At i == len the byte lookup falls back to a space (skipped) or ends the
  # quoted token at len anyway: both loops end with the same tokens.
  # anchor 73: while i < bytes.len() {
  # anchor 82: while i < bytes.len() && bytes.get(i) != Some(&c) {
  "iem-rpp/src/read\\.rs:(73|82):.*replace < with <= in raw_tokens$",
  # A time equal to an era's first_seen lies inside that era's window, which
  # the branch before already returned.
  "iem-rpp/src/aliases\\.rs.*replace > with >= in Eras::candidates$",
  # `flags & !1` has bit 0 clear, so `| muted` and `^ muted` are the same.
  "iem-rpp/src/export\\.rs.*replace \\| with \\^ in export$",
  # Unobservable (#20): which parent directory commit fsyncs (result dropped); durability shows only across a power loss.
  # anchor 229: if let Some(parent) = self.target.parent().filter(|p| !p.as_os_str().is_empty()) {
  "iem-migrate/src/stage\\.rs:229:.*delete ! in Stage::commit$",
  # Equivalent (S5). At exactly −60 dB both branches of the fader domain give −60.
  "iem-server/src/view\\.rs.*replace > with >= in ui_db$",
  # Equivalent (S5). p = ±0 rounds to 0 % and is "C" before the side is chosen.
  # anchor 46: } else if p < 0.0 {
  "iem-server/src/backup\\.rs:46:.*replace < with <= in pan$",
  # Unobservable (S5): the frame age `< 2 s` differs only at the exact nanosecond.
  "iem-server/src/engine/media\\.rs.*replace < with <= in MediaLink::diagnostics$",
  # Unobservable (S5): Listen commands on the mixer socket are ignored either
  # way; without the arm the default one refuses them and only logs a warning.
  "iem-server/src/mixer_ws\\.rs.*delete match arm ClientMsg::ListenStart.* in handle$",
  # Unobservable (S5): the pruned count only decides whether it is logged.
  "iem-server/src/backup_daemon\\.rs.*replace > with (==|<|>=) in run$",
  # The backup daemon's endless 30 s loop on the wall clock (whole-body
  # replacement only); its steps are tested functions (due, settle,
  # RefusalAlarms, refusal_alarm).
  "iem-server/src/backup_daemon\\.rs.*replace run with \\(\\)$",
  # Equivalent (S6): the creation flags (the children's and the guard's
  # helpers') are distinct bits, so `^` gives the same value as `|`.
  "iem-win/src/decide\\.rs.*replace \\| with \\^ in (creation_flags|helper_flags)$",
  # The guard pipe's Windows listener (private DACL, first instance, remote
  # refused) is not compiled on Linux; the windows job's pipe tests run it,
  # and its Unix twin of the same name serves every pipe test here.
  "iem-guard/src/pipe\\.rs.*replace listen -> ",
  # Unobservable (S6): the accept error kind only decides whether it is
  # logged; both paths wait the same poll.
  "iem-guard/src/pipe\\.rs.*replace != with == in serve",
  # Equivalent (S6): the retry loop's `elapsed < limit` differs from `<=`
  # only at the exact nanosecond.
  "iem-guard/src/cli\\.rs.*replace < with <= in call_starting",
  # Equivalent (S6): the session end's wait for the engine, `elapsed <
  # session_wait`, differs from `<=` only at the exact nanosecond.
  "iem-guard/src/daemon\\.rs.*replace < with <= in session_end$",
  # Equivalent (S6): the first pipe instance's retry, `elapsed < limit`,
  # differs from `<=` only at the exact nanosecond.
  "iem-guard/src/pipe\\.rs.*replace < with <= in retry",
  # Unobservable (S6/S1c): `if !hil.is_empty()` in `run` only decides whether
  # the "HIL's spare card outputs …" info line is logged — no state and no
  # return value change (like the excluded `delete ! in Control::tick`). `run`
  # IS reachable from unit tests (run_bounded), but no test captures or asserts
  # that log, so the mutant is unobservable. The line anchor is essential:
  # `run` also has a `delete ! in run` on the block-size guard
  # `if !(1..=MAX_BLOCK).contains(&cfg.block)`, which is NOT equivalent and IS
  # killed by `run_refuses_a_bad_block_and_a_bad_site`, and `delete ! in
  # run_hil` is killed too — both must stay mutated.
  # anchor 452: if !hil.is_empty() {
  "iem-engine/src/engine\\.rs:452:.*delete ! in run$",
  # Equivalent (S6): the DER length fold `(n << 8) | usize::from(b)` shifts the
  # accumulator left by 8, so its low 8 bits are always zero; OR-ing in a byte
  # (0..=255) there equals XOR-ing it, so `| b` and `^ b` are identical (like
  # the excluded iem-win `creation_flags` `| → ^`). `<< → >>` and `| → &` do
  # differ and stay mutated, killed by the multi-byte length tests.
  "iem-guard/src/tls\\.rs.*replace \\| with \\^ in element$",
]
