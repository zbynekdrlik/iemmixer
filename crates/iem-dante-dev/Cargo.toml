[package]
name = "iem-dante-dev"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Links dante-stack (GPL-3.0-or-later, parts adapted from teodly/inferno).
license = "GPL-3.0-or-later"
repository.workspace = true
description = "iemmixer's Dante device binary on the Gen 3 box (#72): dante-stack's daemon CLI stamped with iemmixer's version and build, plus the box's health"

[lib]
path = "src/lib.rs"

[[bin]]
name = "iem-dante-dev"
path = "src/main.rs"

[dependencies]
iem-dante = { package = "dante-stack", git = "https://github.com/zbynekdrlik/dstack", tag = "v0.3.3" }
# The box's health (#72, taken from dante-stack at its v0.2.0): its line and
# the server's /api/version reply. Both already in the closure through
# dante-stack.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
