[package]
name = "iem-guard"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "iemmixer guard (S6): switches the IEM PC between REAPER and iemmixer; the iemmixer-guard daemon and the iemmode CLI"
# The two binaries are listed below; nothing is discovered from src/bin.
autobins = false

# Never iem-audio-io or iem-engine: the guard does not link the ASIO host (S6
# design note §3) and stays outside the engine's dependency closure. The
# Windows effects (Task 9) add iem-win.
[dependencies]
# The guard pipe (sync): the daemon's listener and iemmode's client (Task 10).
interprocess = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Bundle sums (SHA256SUMS) and the predecessor's exe identity.
sha2 = "0.10"
thiserror = "2.0"
# The site's [guard] and [card] tables (Task 9).
toml = "0.9"
tracing = "0.1"
# REAPER's web control and the /api/version checks (Task 9); TLS is chosen
# there, with the public-host check.
ureq = { version = "3.4", default-features = false }
# Bundle install: deflate only (the zips come from Compress-Archive).
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "iemmixer-guard"
path = "src/bin/iemmixer-guard.rs"

[[bin]]
name = "iemmode"
path = "src/bin/iemmode.rs"
