[package]
name = "iem-soakclient"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "iemmixer soak harness (S7): one mixer socket and one listen socket on a member's mix, counted into a JSON summary"

[dependencies]
# On the PC the client signs its own engineer token with the server's JWT
# secret (#10 decision, 2026-10-07): the server's own HS256 (`iem_core::jwt`,
# #74). The tests also pin this client's wire forms to the server's wire
# types in iem-core (UI protocol, ClientMsg, ServerMsg, SiteLinks); the
# client links no server crate. Without defaults, as iem-ui uses it.
iem-core = { path = "../iem-core", default-features = false, features = ["jwt"] }
# The listen frames are the server's Opus (X4); the server's own codec crate.
opus = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Sync WebSocket client (already locked through axum's ws); plain ws:// on the LAN.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# Login and /api/site over plain HTTP, as the guard uses it.
ureq = { version = "3.4", default-features = false }

# The housekeeping CPU Set (S1c profile), as the engine sets its own.
[target.'cfg(windows)'.dependencies]
iem-win = { path = "../iem-win" }

[dev-dependencies]
# A listen frame's 960 samples are the engine's FRAME_48K (tally's test).
iem-engine-proto = { path = "../iem-engine-proto" }
# write_summary's tests (a temporary directory), as the other crates use it.
tempfile = "3"
