[package]
name = "iem-audio-io"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "iemmixer audio backends: the Process trait, deterministic Offline and paced NullRt"

[dependencies]
# The audio contract shared with the Dante device (Block, Process, StreamStats,
# Planar, Fault, panic_message, hist, telemetry), #72.
dstack-audio-io = { git = "https://github.com/zbynekdrlik/dstack", tag = "v0.6.99" }

[dev-dependencies]
# tests/rt.rs: the stream histograms and the telemetry neither allocate nor
# free (that binary runs on its allocator; warn mode counts violations instead
# of aborting).
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }

[lints.rust]
# `iem_rtsan` is set by the rtsan CI job (nightly, -Zsanitizer=realtime): hist::PeriodHist::record.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(iem_rtsan)"] }
