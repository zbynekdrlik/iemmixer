[package]
name = "iem-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTPS/WebSocket server of iemmixer"

[dependencies]
# Core library
iem-core = { path = "../iem-core", features = ["vapid", "jwt"] }

# The engine protocol (MIT OR Apache-2.0; the GPL engine is a separate process)
iem-engine-proto = { path = "../iem-engine-proto" }

# Web framework
axum = { version = "0.8", features = ["macros", "json", "ws"] }

# Tower middleware
tower-http = { version = "0.6", features = ["fs", "set-header"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }

# HTTP client (Web Push, public-IP detection)
reqwest = { version = "0.12", features = ["json"] }

# Serialization (float_roundtrip: a backup, preset or snapshot reads back
# with exactly the values that were written)
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

# Embed WASM assets
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"

# Date/time for daily snapshots
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# System info
local-ip-address = "0.6"

# For standalone server binary
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# TLS support for HTTPS (PWA installability on phones)
axum-server = { version = "0.8", features = ["tls-rustls"], optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
# The certificate of `https_domain` from an ACME CA by DNS-01 through the
# Cloudflare DNS API (#91, ported from fohmixer): instant-acme on rustls/ring
# (rcgen makes the key and the CSR), plain http only for a loopback test
# directory (hyper-util), the certificate's names and expiry read back
# (x509-parser), and a stand-in certificate while none is stored (rcgen)
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring", "rcgen"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"], optional = true }
x509-parser = { version = "0.18", optional = true }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"], optional = true }

# Listen and talkback: Opus in the server (X4; the engine links no codec, I1)
bytes = { version = "1", optional = true }
opus = { version = "0.4", optional = true }

# Web Push notifications (RFC 8291 + VAPID) — pure Rust, no OpenSSL
p256 = { version = "0.14", features = ["ecdh"] }
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
# argon2's salt (password-hash 0.5 takes a rand_core 0.6 RNG) and the
# secrets' random bytes; p256 0.14 draws its keys from the OS itself
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
url = "2"

# PIN hashing (argon2id, keyed with the pepper)
argon2 = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[[bin]]
name = "iem-server"
path = "src/bin/server.rs"
required-features = ["standalone"]

[[test]]
name = "pin_cli"
path = "tests/pin_cli.rs"
required-features = ["standalone"]

[[test]]
name = "roster_cli"
path = "tests/roster_cli.rs"
required-features = ["standalone"]

[[test]]
name = "cloudflare_cli"
path = "tests/cloudflare_cli.rs"
required-features = ["standalone"]

[[test]]
name = "graceful_stop"
path = "tests/graceful_stop.rs"
required-features = ["standalone"]

[features]
default = []
standalone = ["tracing-subscriber", "tokio/signal"]
tls = ["axum-server", "rustls", "dep:instant-acme", "dep:hyper-util", "dep:x509-parser", "dep:rcgen", "dep:bytes"]
audio = ["dep:bytes", "dep:opus"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
toml = "0.9"
tracing-test = "0.2"
# Property tests (tests/backup_roundtrip.rs); no fork/timeout runner needed
proptest = { version = "1.11", default-features = false, features = ["std"] }
# The real engine for the server's tests (never linked into the server)
iem-engine = { path = "../iem-engine" }
iem-audio-io = { path = "../iem-audio-io" }
# ACME tests (#91): the test CA signs the double's CSRs (rcgen), ring checks
# the double's JWS signatures, the test certificates' validity (time) and a
# TLS client for the reloaded listener (tokio-rustls)
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
ring = "0.17"
time = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
