<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IEM Mixer</title>
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0" />
    <link data-trunk rel="copy-file" href="manifest.json" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link data-trunk rel="copy-file" href="audio_player.js" />
    <link data-trunk rel="copy-file" href="talkback.js" />
    <link data-trunk rel="copy-file" href="talkback-worklet.js" />
    <link data-trunk rel="copy-file" href="alert.mp3" />
    <link data-trunk rel="copy-file" href="icon.svg" />
    <link data-trunk rel="copy-file" href="icon-192.png" />
    <link data-trunk rel="copy-file" href="icon-512.png" />
    <link rel="icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
    <noscript>This app requires JavaScript and WebAssembly to run.</noscript>
    <div id="app-shell">
        <style>
            #app-shell {
                position: fixed; inset: 0;
                background: #1a1a2e; color: #e0e0e0;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                z-index: 9999;
            }
            #app-shell h1 {
                font-size: 1.2rem; letter-spacing: 0.15em;
                margin-bottom: 2rem; text-transform: uppercase;
            }
            .shell-spinner {
                width: 40px; height: 40px;
                border: 3px solid rgba(255,255,255,0.15);
                border-top-color: #4fc3f7;
                border-radius: 50%;
                animation: shell-spin 0.8s linear infinite;
            }
            .shell-member {
                margin-top: 1rem; font-size: 0.9rem; opacity: 0.7;
            }
            @keyframes shell-spin { to { transform: rotate(360deg); } }
        </style>
        <h1>IEM Mixer</h1>
        <div class="shell-spinner"></div>
        <div class="shell-member" id="shell-member-name"></div>
    </div>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
    }
    // Show cached member name before WASM loads
    try {
        var raw = localStorage.getItem('iem_token');
        if (raw) {
            var auth = JSON.parse(raw);
            if (auth && auth.member) {
                document.getElementById('shell-member-name').textContent =
                    'Loading ' + auth.member + '\u2019s mixer\u2026';
            }
        }
    } catch(e) {}
    </script>
</body>
</html>
