[package]
name = "iem-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
# D1(a): the engine links the GPL MGA limiter port, so the engine is GPL too.
license = "GPL-3.0-or-later"
repository.workspace = true
description = "iemmixer audio engine: site graph, real-time mixer, state, persistence and pipes"

[dependencies]
iem-audio-io = { path = "../iem-audio-io" }
iem-dsp = { path = "../iem-dsp" }
iem-engine-proto = { path = "../iem-engine-proto" }
iem-limiter-mga = { path = "../iem-limiter-mga" }
interprocess = "2.4"
rtrb = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "float_roundtrip"] }
sha2 = "0.10"
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
triple_buffer = "9"

[target.'cfg(target_os = "linux")'.dependencies]
# Gen 3 phase C (#72, design §3): our own Dante device as the engine's audio
# backend on Linux (`run --backend dante`, src/dante.rs): the device hosted
# in the engine's process and the pump that drives `Process` on its media
# clock. GPL-3.0-or-later, as the engine already is (the limiter); never
# linked by iem-server outside its tests.
# The Dante device lives in dstack (all Dante code, #72 2026-10-30).
iem-dante = { package = "dstack", git = "https://github.com/zbynekdrlik/dstack", tag = "v0.6.62" }

[dev-dependencies]
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# tests/dante_loopback.rs (Gen 3 phase C): the device's flow
# grant runs on a runtime (`#[tokio::test]`, a bounded wait), as iem-dante's
# own loopback test. Already in the engine's Linux closure through
# iem-dante, at these features.
tokio = { version = "1", features = ["macros", "rt", "time"] }

[lints.rust]
# `iem_rtsan` is set by the rtsan CI job (nightly, -Zsanitizer=realtime).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(iem_rtsan)"] }
